services:
  - type: web
    name: urbania
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLANIFICADOR_PASSWORD
        sync: false
      - key: CONSULTOR_PASSWORD
        sync: false
      # Opcional: sin esta clave, UrbanIA genera informes mediante reglas.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
